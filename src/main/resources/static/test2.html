<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hello World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4">
<div class="bg-white rounded-xl shadow-xl p-8 max-w-md w-full transform transition-all hover:scale-[1.02] hover:shadow-2xl">
    <div class="text-center mb-6">
        <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-100 mb-4">
            <i class="fa fa-globe text-2xl text-blue-600"></i>
        </div>
        <h1 class="text-[clamp(2rem,5vw,3rem)] font-bold text-gray-800 mb-2">Hello, World!</h1>
        <p class="text-gray-600">Welcome to your first web page</p>
    </div>

    <div class="flex justify-center">
        <button id="changeTextBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 px-6 rounded-lg transition-all duration-300 flex items-center shadow-md hover:shadow-lg">
            <i class="fa fa-magic mr-2"></i> Change Text
        </button>
    </div>
</div>

<script>
    document.getElementById('changeTextBtn').addEventListener('click', function() {
        const heading = document.querySelector('h1');
        const messages = ['你好，世界！', 'Bonjour le monde!', 'Hallo Welt!', 'Ciao mondo!'];
        const randomMsg = messages[Math.floor(Math.random() * messages.length)];
        heading.textContent = randomMsg;

        // 添加动画效果
        heading.classList.add('animate-pulse');
        setTimeout(() => {
            heading.classList.remove('animate-pulse');
        }, 1000);
    });
</script>
</body>
</html>
